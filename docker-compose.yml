services:
  game:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL}"
      GAME_DATABASE_SCHEMA: "game"
      WORLD_DATABASE_SCHEMA: "world_catalogue"
      VEHICLE_DATABASE_SCHEMA: "vehicle_catalogue"
      DATABASE_POOL_SIZE: "5"
      SUPABASE_URL: "${SUPABASE_URL:?Set SUPABASE_URL}"
      SUPABASE_PUBLISHABLE_KEY: "${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY}"
      SUPABASE_JWKS_URL: "${SUPABASE_JWKS_URL:?Set SUPABASE_JWKS_URL}"
      GAME_TIME_SCALE: "1"
      LOG_LEVEL: "INFO"
      VALHALLA_URL: "https://valhalla1.openstreetmap.de"
      VALHALLA_CLIENT_ID: "world-freight-idle-local"
      HTTP_USER_AGENT: "WorldFreightIdleMVP/0.4 (local-development)"
    volumes:
      - ./data:/app/data
